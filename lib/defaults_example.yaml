---
opensslpath: /opt/homebrew/bin/openssl # Path to openssl
domains:                                   # The first one is the default domain
  - example.com
  - dmz.example.com
  - other.example.com
domainalias: com.example # Alias of the Root CA in the Java truststore (installcerts.py java)
dockerhost: docker # Docker host, without domain (installcerts.py docker)
dockerdir: /users/example/Docker/my_project # Certificates go to its certs/ subdirectory
zipfilename: certbackup.zip # Backup file, also attached to the 1Password item issuing-ca
# 1Password vault with one Password item per private key: root-ca, issuing-ca, <cert name>
onepassword:
  vault: Home CA
# Synology DSM certificate deployment (optional, used by installcerts.py synology)
synology:
  host: nas.example.com                    # DSM hostname
  port: 5001                               # DSM HTTPS port
  certificates:                            # Certificates (names as issued) to replace in DSM,
    - example.com                          # matched by their CN
    - nas.example.com
  login: op://Private/Synology admin       # 1Password item with username, password and optional OTP
# Proxmox VE deployment (optional, used by installcerts.py proxmox)
proxmox:
  certificate: example.com                 # Certificate (name as issued) installed as the pveproxy certificate
  nodes:                                   # ssh destinations of the nodes (passwordless, as root;
    - pve1                                 # user and hostname may come from ~/.ssh/config)
    - pve2
# UniFi OS console deployment (optional, used by installcerts.py unifi)
unifi:
  host: unifi.example.com                  # Console hostname
  certificate: example.com                 # Certificate (name as issued) to serve on the console
  login: op://Private/UniFi local admin    # 1Password item with username, password and optional OTP
# Subject fields of the Root and Issuing CA certificates
certproperties:
- country: CH
- state: ZH
- city: Zurich
- org: Private
- orgunit: Private
- email: sam@muster.ch
rootcaname: Sample Root CA
issuingcaname: Sample Issuing CA
